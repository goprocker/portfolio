name: Dependency Sync & Audit

on:
  schedule:
    - cron: '0 8 * * 1' # Runs every Monday at 08:00 UTC
  workflow_dispatch:     # Allows manual trigger from GitHub UI
  push:
    paths:
      - 'package.json'
      - '.github/workflows/syncmydep.yml'
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: dependency-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Apply dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --audit-level=moderate

      - name: Verify dependency changes
        run: |
          npm ci
          npm run check
          npm run build
          npm audit --audit-level=moderate

      - name: Commit fixes directly to main
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No dependency changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit \
            -m "fix(deps): synchronize audited lockfile" \
            -m "Apply verified dependency security fixes from the scheduled audit."
          git push origin HEAD:main
